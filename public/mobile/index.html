<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2E7D32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="惜食救援">
    <meta name="description" content="惜食救援 — 讓美食不被浪費，用優惠價格拯救即期食品">

    <title>惜食救援</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts: Outfit & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- App CSS -->
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <!-- App Container -->
    <div id="app"></div>

    <!-- Bottom Navigation -->
    <div id="bottom-nav" class="hidden"></div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Vendor Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

    <!-- App Scripts (order matters: api & auth first, then views, then app last) -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <!-- Views -->
    <script src="js/views/login.js"></script>
    <script src="js/views/register.js"></script>
    <script src="js/views/consumer-map.js"></script>
    <script src="js/views/consumer-home.js"></script>
    <script src="js/views/consumer-store.js"></script>
    <script src="js/views/consumer-pay.js"></script>
    <script src="js/views/consumer-orders.js"></script>
    <script src="js/views/consumer-points.js"></script>
    <script src="js/views/consumer-scan.js"></script>
    <script src="js/views/store-dashboard.js"></script>
    <script src="js/views/store-add-item.js"></script>
    <script src="js/views/store-pair.js"></script>
    <script src="js/views/store-machine.js"></script>
    <script src="js/views/store-orders.js"></script>

    <!-- Main App (loaded last) -->
